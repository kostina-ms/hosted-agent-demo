# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: travel-orchestrator
services:
  TravelOrchestrator:
    host: azure.ai.agent
    project: .
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: FoundryAgentSample.dll
      dependencyResolution: remote_build
    kind: hosted
    name: TravelOrchestrator
    displayName: Travel Orchestrator
    description: Orchestrates travel planning across specialist agents.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
